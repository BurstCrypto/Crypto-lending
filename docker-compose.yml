name: crypto-lending

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    # These are deliberate local-only fixtures. Production uses separately
    # generated bootstrap, migration, API, and worker credentials.
    environment:
      POSTGRES_DB: crypto_lending
      POSTGRES_USER: crypto_admin
      POSTGRES_PASSWORD: local_admin_only
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crypto_admin -d crypto_lending']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-principals-data:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap-principals.sql:/opt/crypto-lending/bootstrap-principals.sql:ro
      - ./infra/postgres/local-init-principals.sql:/docker-entrypoint-initdb.d/10-local-principals.sql:ro

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ['redis-server', '--appendonly', 'yes', '--aclfile', '/usr/local/etc/redis/users.acl']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '--no-auth-warning',
          '--user',
          'crypto_api_a',
          '--pass',
          'local-api-current',
          'ping',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
      - ./infra/redis/users.acl:/usr/local/etc/redis/users.acl:ro

  localstack:
    build:
      context: ./infra/localstack
      dockerfile: Dockerfile
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: '0'
    ports:
      - '127.0.0.1:${LOCALSTACK_PORT:-4566}:4566'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:4566/_localstack/init/ready | grep -Eq ''"completed"[[:space:]]*:[[:space:]]*true'' && awslocal sqs get-queue-url --queue-name crypto-lending-jobs >/dev/null && awslocal sqs get-queue-url --queue-name crypto-lending-jobs-dlq >/dev/null',
        ]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  postgres-principals-data:
  redis-data:
