name: Railway reviewed deployment

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: Immutable API image digest
        required: true
        type: string
      gateway_image:
        description: Immutable gateway image digest
        required: true
        type: string
      web_image:
        description: Immutable web image digest
        required: true
        type: string
      public_domain:
        description: Reviewed lowercase production hostname
        required: true
        type: string
      release_candidate_run_id:
        description: Successful Foundation CI run for this exact main revision
        required: true
        type: string
      apply:
        description: Apply the exact reviewed plan after environment approval
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: railway-production-deployment
  cancel-in-progress: false

env:
  RAILWAY_DEPLOYMENT_TARGET_ID: railway-faba6f65-716d-4171-bc71-c10308709b7a-production-b4df2af4-6cbd-4f9d-9d0e-d47465868121

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-plan
    env:
      GH_TOKEN: ${{ github.token }}
      RAILWAY_API_IMAGE: ${{ inputs.api_image }}
      RAILWAY_GATEWAY_IMAGE: ${{ inputs.gateway_image }}
      RAILWAY_PUBLIC_DOMAIN: ${{ inputs.public_domain }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_WEB_IMAGE: ${{ inputs.web_image }}
    steps:
      - name: Check out the exact deployment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable deployment inputs and protected main ancestry
        env:
          RELEASE_RUN_ID: ${{ inputs.release_candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$RAILWAY_API_IMAGE" =~ ^ghcr\.io/burstcrypto/crypto-lending-api@sha256:[a-f0-9]{64}$ ]]
          [[ "$RAILWAY_GATEWAY_IMAGE" =~ ^ghcr\.io/burstcrypto/crypto-lending-gateway@sha256:[a-f0-9]{64}$ ]]
          [[ "$RAILWAY_WEB_IMAGE" =~ ^ghcr\.io/burstcrypto/crypto-lending-web@sha256:[a-f0-9]{64}$ ]]
          [[ "$RAILWAY_PUBLIC_DOMAIN" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$RAILWAY_TOKEN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install pinned repository dependencies
        run: npm ci --ignore-scripts

      - name: Download the exact successful release candidate
        env:
          RELEASE_RUN_ID: ${{ inputs.release_candidate_run_id }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          test "$(jq -r .head_sha <<<"$run_json")" = "$GITHUB_SHA"
          test "$(jq -r .head_branch <<<"$run_json")" = main
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .path <<<"$run_json")" = .github/workflows/ci.yml
          mkdir release-candidate
          gh run download "$RELEASE_RUN_ID" \
            --name "crypto-lending-release-candidate-$GITHUB_SHA" \
            --dir release-candidate
          test -s release-candidate/release-candidate-manifest.json

      - name: Verify exact image repositories and OCI revision metadata
        run: |
          set -euo pipefail
          for image in "$RAILWAY_API_IMAGE" "$RAILWAY_GATEWAY_IMAGE" "$RAILWAY_WEB_IMAGE"; do
            docker pull "$image" >/dev/null
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")" = \
              'https://github.com/BurstCrypto/Crypto-lending'
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
            created="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.created" }}' "$image")"
            [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          done

      - name: Create pinned Railway plan artifact
        run: |
          set -euo pipefail
          SOURCE_TREE="$(git rev-parse "$GITHUB_SHA:.railway")"
          npx --yes @railway/cli@5.51.0 config plan \
            --out railway.plan \
            --source-tree "$SOURCE_TREE"
          sha256sum railway.plan > railway.plan.sha256

      - name: Verify signed seven-role launch decision against exact artifacts
        id: authority
        env:
          PUBLIC_LAUNCH_AUTHORITY_DECISION_BASE64: ${{ secrets.PUBLIC_LAUNCH_AUTHORITY_DECISION_BASE64 }}
          RAILWAY_PRODUCTION_EVIDENCE_BASE64: ${{ secrets.RAILWAY_PRODUCTION_EVIDENCE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_LAUNCH_AUTHORITY_DECISION_BASE64"
          test -n "$RAILWAY_PRODUCTION_EVIDENCE_BASE64"
          umask 077
          printf '%s' "$PUBLIC_LAUNCH_AUTHORITY_DECISION_BASE64" | base64 --decode > authority-decision.json
          printf '%s' "$RAILWAY_PRODUCTION_EVIDENCE_BASE64" | base64 --decode > railway-production-evidence.json
          npx tsx scripts/verify-railway-deployment-approval.ts \
            --decision authority-decision.json \
            --evidence railway-production-evidence.json \
            --plan railway.plan \
            --release-manifest release-candidate/release-candidate-manifest.json \
            --target-id "$RAILWAY_DEPLOYMENT_TARGET_ID"

      - name: Bind plan to revision, images, domain, and verified authority
        env:
          AUTHORITY_DECISION_SHA256: ${{ steps.authority.outputs.authorityDecisionSha256 }}
          EVIDENCE_SHA256: ${{ steps.authority.outputs.productionEvidenceBundleSha256 }}
          RELEASE_MANIFEST_SHA256: ${{ steps.authority.outputs.releaseCandidateManifestSha256 }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const binding = {
            schemaVersion: 1,
            artifactType: 'RAILWAY_DEPLOYMENT_PLAN_BINDING',
            revision: process.env.GITHUB_SHA,
            apiImage: process.env.RAILWAY_API_IMAGE,
            gatewayImage: process.env.RAILWAY_GATEWAY_IMAGE,
            webImage: process.env.RAILWAY_WEB_IMAGE,
            publicDomain: process.env.RAILWAY_PUBLIC_DOMAIN,
            deploymentTargetId: process.env.RAILWAY_DEPLOYMENT_TARGET_ID,
            releaseCandidateManifestSha256: process.env.RELEASE_MANIFEST_SHA256,
            productionEvidenceBundleSha256: process.env.EVIDENCE_SHA256,
            authorityDecisionSha256: process.env.AUTHORITY_DECISION_SHA256,
            planSha256: crypto.createHash('sha256').update(fs.readFileSync('railway.plan')).digest('hex'),
          };
          for (const [name, value] of Object.entries(binding)) {
            if (value === undefined || value === '') throw new Error(`Missing binding ${name}`);
          }
          fs.writeFileSync('railway-plan-binding.json', `${JSON.stringify(binding)}\n`, {
            encoding: 'utf8', flag: 'wx', mode: 0o444,
          });
          NODE

      - name: Upload reviewed plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: railway-plan-${{ github.run_id }}
          path: |
            railway.plan
            railway.plan.sha256
            railway-plan-binding.json
          if-no-files-found: error
          retention-days: 7

  apply:
    if: inputs.apply
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-apply
    env:
      GH_TOKEN: ${{ github.token }}
      RAILWAY_API_IMAGE: ${{ inputs.api_image }}
      RAILWAY_GATEWAY_IMAGE: ${{ inputs.gateway_image }}
      RAILWAY_PUBLIC_DOMAIN: ${{ inputs.public_domain }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_WEB_IMAGE: ${{ inputs.web_image }}
    steps:
      - name: Check out the exact planned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the plan from this workflow run
        run: gh run download "$GITHUB_RUN_ID" --name "railway-plan-$GITHUB_RUN_ID"

      - name: Verify the immutable plan binding
        run: |
          set -euo pipefail
          sha256sum --check railway.plan.sha256
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const binding = JSON.parse(fs.readFileSync('railway-plan-binding.json', 'utf8'));
          const exact = {
            revision: process.env.GITHUB_SHA,
            apiImage: process.env.RAILWAY_API_IMAGE,
            gatewayImage: process.env.RAILWAY_GATEWAY_IMAGE,
            webImage: process.env.RAILWAY_WEB_IMAGE,
            publicDomain: process.env.RAILWAY_PUBLIC_DOMAIN,
            deploymentTargetId: process.env.RAILWAY_DEPLOYMENT_TARGET_ID,
            planSha256: crypto.createHash('sha256').update(fs.readFileSync('railway.plan')).digest('hex'),
          };
          for (const [name, value] of Object.entries(exact)) {
            if (binding[name] !== value) throw new Error(`Plan binding mismatch: ${name}`);
          }
          for (const name of ['releaseCandidateManifestSha256', 'productionEvidenceBundleSha256', 'authorityDecisionSha256']) {
            if (!/^[a-f0-9]{64}$/.test(binding[name])) throw new Error(`Invalid plan binding: ${name}`);
          }
          NODE
          test -n "$RAILWAY_TOKEN"

      - name: Refuse unapproved existing gateway domains
        run: |
          set -euo pipefail
          status_json="$(npx --yes @railway/cli@5.51.0 status --json)"
          mapfile -t existing_domains < <(
            jq -r '.environments.edges[].node
              | select(.name == "production")
              | .serviceInstances.edges[].node
              | select(.serviceName == "gateway")
              | .domains.customDomains[]?.domain' <<<"$status_json"
          )
          for existing_domain in "${existing_domains[@]}"; do
            test "$existing_domain" = "$RAILWAY_PUBLIC_DOMAIN" || {
              echo "Refusing to leave unapproved gateway domain active" >&2
              exit 1
            }
          done

      - name: Apply only the reviewed pinned plan
        run: >-
          npx --yes @railway/cli@5.51.0 config apply --yes --confirm-destructive
          --plan railway.plan

      - name: Register or reconcile the approved gateway domain
        run: |
          set -euo pipefail
          if npx --yes @railway/cli@5.51.0 domain status "$RAILWAY_PUBLIC_DOMAIN" \
            --service gateway >/dev/null 2>&1; then
            npx --yes @railway/cli@5.51.0 domain update "$RAILWAY_PUBLIC_DOMAIN" \
              --service gateway --port 8080 --json
          else
            npx --yes @railway/cli@5.51.0 domain "$RAILWAY_PUBLIC_DOMAIN" \
              --service gateway --port 8080 --json
          fi
          reconciled_json="$(npx --yes @railway/cli@5.51.0 status --json)"
          test "$(
            jq -r --arg expected "$RAILWAY_PUBLIC_DOMAIN" '
              [.environments.edges[].node
                | select(.name == "production")
                | .serviceInstances.edges[].node
                | select(.serviceName == "gateway")
                | .domains.customDomains[]?.domain]
              | length == 1 and .[0] == $expected' <<<"$reconciled_json"
          )" = true
