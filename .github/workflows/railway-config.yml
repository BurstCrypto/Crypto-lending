name: Railway infrastructure review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.railway/**'
      - '.github/workflows/railway-config.yml'

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Railway topology offline
        run: |
          npm ci --ignore-scripts
          npm run test:railway

      - name: Check Railway plan configuration
        id: readiness
        env:
          RAILWAY_API_IMAGE: ${{ vars.RAILWAY_API_IMAGE }}
          RAILWAY_GATEWAY_IMAGE: ${{ vars.RAILWAY_GATEWAY_IMAGE }}
          RAILWAY_PUBLIC_DOMAIN: ${{ vars.RAILWAY_PUBLIC_DOMAIN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WEB_IMAGE: ${{ vars.RAILWAY_WEB_IMAGE }}
        run: |
          set -euo pipefail
          missing=()
          for name in RAILWAY_API_IMAGE RAILWAY_GATEWAY_IMAGE RAILWAY_PUBLIC_DOMAIN RAILWAY_TOKEN RAILWAY_WEB_IMAGE; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::notice::Live Railway plan unavailable; offline topology validation passed, but production-plan is missing: %s\n' "${missing[*]}"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1
        if: steps.readiness.outputs.ready == 'true'
        with:
          cli-version: 5.51.0
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
        env:
          RAILWAY_API_IMAGE: ${{ vars.RAILWAY_API_IMAGE }}
          RAILWAY_GATEWAY_IMAGE: ${{ vars.RAILWAY_GATEWAY_IMAGE }}
          RAILWAY_PUBLIC_DOMAIN: ${{ vars.RAILWAY_PUBLIC_DOMAIN }}
          RAILWAY_WEB_IMAGE: ${{ vars.RAILWAY_WEB_IMAGE }}
